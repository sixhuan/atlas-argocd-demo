apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: mysql123
spec:
  ports:
  - port: 3306
  selector:
    app: mysql123
  clusterIP: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: mysql123
spec:
  selector:
    matchLabels:
      app: mysql123
  template:
    metadata:
      labels:
        app: mysql123
    spec:
      containers:
      - image: mysql:8
        imagePullPolicy: IfNotPresent
        name: mysql123
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: pass
        - name: MYSQL_DATABASE
          value: example123
        readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 10
            periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 15
          periodSeconds: 15
        ports:
        - containerPort: 3306
          name: mysql123